name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Setup signing keystore (Secrets only)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "❌ ERROR: missing one of KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_PASSWORD/KEY_ALIAS in repo Secrets"
            echo "Configure at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          if [ ! -s android/app/release.jks ]; then
            echo "❌ ERROR: release.jks is empty after decode"
            exit 1
          fi
          printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\nstoreFile=release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          chmod 600 android/app/release.jks android/key.properties
          echo "✅ Keystore ready, alias=$KEY_ALIAS"

      - name: Build APK
        run: flutter build apk --release --build-name=${{ steps.version.outputs.version }}

      - name: Setup Android SDK (for apksigner)
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'  # latest

      - name: Verify APK signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | head -1)
          echo "=== 1. Keystore cert (expected) ==="
          keytool -list -v -keystore android/app/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1 \
            | grep -E "SHA1:|SHA256:|Owner:" | head -5
          echo
          echo "=== 2. APK signer cert (apksigner verify) ==="
          $APKSIGNER verify --print-certs "$APK" 2>&1 | tee /tmp/apk-cert.txt
          echo
          echo "=== 3. SHA1 comparison ==="
          KEYSTORE_SHA1=$(keytool -list -v -keystore android/app/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | grep "SHA1:" | head -1 | awk '{print $2}' | tr -d : | tr 'A-Z' 'a-z')
          # apksigner prints: "SHA-1 digest: <hex>" or sometimes "Signer #1 certificate DN: ..."
          APK_SHA1=$($APKSIGNER verify --print-certs "$APK" 2>&1 | grep -oE "SHA-1 digest: [a-f0-9:]+" | head -1 | awk '{print $3}' | tr -d : | tr 'A-Z' 'a-z')
          if [ -z "$APK_SHA1" ]; then
            APK_SHA1=$($APKSIGNER verify --print-certs "$APK" 2>&1 | openssl x509 -fingerprint -sha1 -noout 2>/dev/null | awk -F= '{print $2}')
          fi
          echo "Keystore SHA1: $KEYSTORE_SHA1"
          echo "APK     SHA1: $APK_SHA1"
          if [ -z "$APK_SHA1" ] || [ "$KEYSTORE_SHA1" != "$APK_SHA1" ]; then
            echo "❌ ERROR: signature mismatch or apksigner can't extract cert"
            exit 1
          fi
          echo "✅ Signature verified"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build Web
        run: flutter build web --release

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./artifacts/
      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: ./artifacts/web/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 📦 下载说明

            ### Android
            下载 `app-release.apk` 安装即可。本 release 由仓库 owner 私钥签名，签名固定，可覆盖升级。

            ### Web
            下载 `web-build.zip` 解压后部署到任意静态服务器。
          files: |
            ./artifacts/app-release.apk
            ./artifacts/web/web-build.zip
